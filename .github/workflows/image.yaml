name: Image

# Builds the Docker image on every push, tags it with the commit SHA, pushes it
# to GitHub Container Registry, and tells infra.dx which branch it came from.
# infra.dx deploys it to every environment that follows that branch.

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/zimmerman-team/dx-server
  SERVICE: server

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Tell infra.dx
        env:
          GH_TOKEN: ${{ secrets.DX_INFRA_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::DX_INFRA_TOKEN isn't set, so infra.dx doesn't know about this image."
            exit 0
          fi
          gh workflow run update-tag.yaml -R zimmerman-team/dataxplorer \
            -f service="$SERVICE" -f branch="$GITHUB_REF_NAME" -f tag="$GITHUB_SHA"
